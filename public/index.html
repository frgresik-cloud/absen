<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Siswa</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<style>
:root{--bg:#edfaff;--card:#fff;--line:#d7edf2;--dark:#12303a;--muted:#5d7a83;
--blue:#0891b2;--purple:#0e7490;--green:#0f9f92;--yellow:#c78b22;--red:#d9485f;--teal:#2dd4bf;
--r:14px;--sh:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--dark);font-size:13.5px;-webkit-font-smoothing:antialiased;line-height:1.5}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}

#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.side{width:245px;background:#123b4a;color:#d6f1f5;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.brand{padding:20px 18px 16px;display:flex;gap:11px;align-items:center;border-bottom:1px solid #285666}
.brand-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#0e7490);display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.brand b{color:#fff;font-size:13.5px;font-weight:700;display:block}
.brand span{font-size:10.5px;color:#94a3b8}
.nav{padding:12px 10px;flex:1}
.nav-g{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#64748b;padding:14px 12px 6px;font-weight:700}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:9px;color:#cbd5e1;text-decoration:none;font-size:13px;cursor:pointer;margin-bottom:1px;font-weight:500;transition:.15s}
.nav a:hover{background:#1d5263;color:#fff}
.nav a.on{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(8,145,178,.25)}
.nav a svg{width:16px;height:16px;flex-shrink:0}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.top .tgl b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.top .tgl span{font-size:11.5px;color:var(--muted)}
.top .tgl .jam{color:var(--blue);font-weight:700;font-family:ui-monospace,monospace}
.tr{display:flex;gap:12px;align-items:center}
.tapel{background:#e0f2fe;color:#0369a1;font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid #bae6fd}
.user{display:flex;gap:9px;align-items:center}
.user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex-shrink:0}
.user b{font-size:12.5px;display:block;font-weight:600}
.user span{font-size:10.5px;color:var(--muted);text-transform:capitalize}

.content{padding:24px 26px;flex:1;max-width:1440px;margin:0 auto;width:100%}
.content h2{font-size:21px;font-weight:700;margin-bottom:3px;letter-spacing:-.3px}
.content .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:100;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(15,23,42,.06)}
.bottom-nav button{flex:1;border:none;background:transparent;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px;cursor:pointer;color:#64748b;font-size:11.5px;font-weight:600;transition:.15s}
.bottom-nav button svg{width:22px;height:22px}
.bottom-nav button.on{color:var(--blue)}
body.role-wali .side{display:none}
body.role-wali .bottom-nav{display:flex}
body.role-wali .content{padding-bottom:110px;max-width:720px}
body.role-wali .top{display:none}

.btn{border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px;letter-spacing:.1px}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:#0369a1}
.btn-g{background:#0f172a;color:#fff}
.btn-g:hover{background:#1e293b}
.btn-r{background:var(--red);color:#fff}
.btn-y{background:var(--yellow);color:#fff}
.btn-o{background:#fff;color:var(--dark);border:1px solid var(--line)}
.btn-o:hover{background:#f8fafc;border-color:#cbd5e1}
.btn-sm{padding:7px 12px;font-size:12px}
.btn-lg{padding:14px 22px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);animation:rise .25s ease}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;letter-spacing:-.2px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

.stat{border-radius:var(--r);padding:16px;color:#fff;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.18s}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.12)}
.stat .lbl{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;opacity:.92}
.stat .val{font-size:26px;font-weight:800;line-height:1;margin-top:6px;letter-spacing:-.5px}
.stat .hint{font-size:10px;opacity:.75;margin-top:6px}
.stat.blue{background:linear-gradient(135deg,#0284c7,#0369a1)}
.stat.purple{background:linear-gradient(135deg,#7c3aed,#6d28d9)}
.stat.green{background:linear-gradient(135deg,#0f172a,#1e293b)}
.stat.yellow{background:linear-gradient(135deg,#d97706,#b45309)}
.stat.red{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.stat.teal{background:linear-gradient(135deg,#1e293b,#334155)}
.stat.indigo{background:linear-gradient(135deg,#4f46e5,#4338ca)}
.stat.pink{background:linear-gradient(135deg,#db2777,#be185d)}
.stat.gray{background:linear-gradient(135deg,#64748b,#475569)}
.stat.slate{background:linear-gradient(135deg,#475569,#334155)}

.menu-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.menu-card{border:none;border-radius:16px;padding:26px 18px;color:#fff;text-align:center;cursor:pointer;font-family:inherit;transition:.2s;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 4px 14px rgba(15,23,42,.08)}
.menu-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(15,23,42,.16)}
.menu-card .ic{font-size:30px;line-height:1}
.menu-card b{font-size:13px;font-weight:700;letter-spacing:.3px}
.mc-blue{background:linear-gradient(135deg,#0284c7,#0369a1)}
.mc-green{background:linear-gradient(135deg,#0369a1,#075985)}
.mc-orange{background:linear-gradient(135deg,#ea580c,#c2410c)}
.mc-red{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.mc-purple{background:linear-gradient(135deg,#7c3aed,#6d28d9)}
.mc-teal{background:linear-gradient(135deg,#1e293b,#0f172a)}
.mc-indigo{background:linear-gradient(135deg,#4f46e5,#4338ca)}
.mc-pink{background:linear-gradient(135deg,#db2777,#be185d)}
.mc-slate{background:linear-gradient(135deg,#475569,#334155)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:10px 12px;background:#f8fafc;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}

.bdg{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.1px}
.bg{background:#dcfce7;color:#166534}
.br{background:#fee2e2;color:#991b1b}
.by{background:#fef3c7;color:#92400e}
.bb{background:#dbeafe;color:#1e40af}
.bgr{background:#f1f5f9;color:#475569}
.bp{background:#ede9fe;color:#6d28d9}
.bt{background:#ccfbf1;color:#0f766e}

.f{margin-bottom:14px}
.f label{display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;font-family:inherit;background:#fff;transition:.15s;color:var(--dark)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(2,132,199,.1)}
.f .hint{font-size:11px;color:var(--muted);margin-top:4px}
textarea{resize:vertical;min-height:80px;font-family:inherit;font-size:13px}

.search-input{width:100%;padding:11px 14px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;font-size:13.5px;outline:none;font-family:inherit;transition:.15s}
.search-input::placeholder{color:#7ea8c4}
.search-input:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(2,132,199,.1)}
.search-input.purple{background:#faf5ff;border-color:#d8b4fe}
.search-input.purple::placeholder{color:#a78bda}
.search-input.purple:focus{background:#fff;border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.search-input.green{background:#f8fafc;border-color:#cbd5e1}
.search-input.green::placeholder{color:#94a3b8}
.search-input.green:focus{background:#fff;border-color:#0f172a;box-shadow:0 0 0 3px rgba(15,23,42,.1)}

.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:300;padding:18px;overflow-y:auto}
.modal.show{display:flex;animation:fadeIn .2s}
.modal .panel{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:rise .25s}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .panel.wide{max-width:720px}
@media(max-width:600px){.modal .row{grid-template-columns:1fr}}

.toast{position:fixed;bottom:90px;right:20px;background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:400;box-shadow:0 12px 30px rgba(0,0,0,.25);border-left:4px solid var(--blue);max-width:340px}
body:not(.role-wali) .toast{bottom:20px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{border-left-color:var(--red);background:#450a0a}
.toast.ok{border-left-color:#0ea5e9;background:#082f49}

.av-sm{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#0284c7;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px}
.av-sm img{width:100%;height:100%;object-fit:cover}
.av-lg{width:72px;height:72px;border-radius:50%;overflow:hidden;background:#0284c7;color:#fff;display:grid;place-items:center;font-weight:700;font-size:24px;flex-shrink:0}
.av-lg img{width:100%;height:100%;object-fit:cover}
.td-flex{display:flex;align-items:center;gap:9px}

.foto-upload{display:flex;gap:16px;align-items:center;padding:14px;background:#f8fafc;border-radius:12px;margin-bottom:16px;border:1px dashed var(--line)}
.file-input{padding:8px 10px;font-size:12px;width:100%}

.act-btn{height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:11.5px;padding:0 10px;display:inline-flex;align-items:center;gap:4px;transition:.15s;font-family:inherit;font-weight:600;color:#475569}
.act-btn:hover{background:#f8fafc;color:var(--dark);border-color:#cbd5e1}
.act-btn.danger{color:#b91c1c}
.act-btn.danger:hover{background:#fee2e2;border-color:#fecaca}

.rfid-wrap{display:grid;grid-template-columns:1fr 380px;gap:16px}
@media(max-width:1000px){.rfid-wrap{grid-template-columns:1fr}}
.scan-icon{width:52px;height:52px;margin:0 auto 12px;display:grid;place-items:center;color:var(--blue);animation:pulse 2s infinite}
.scan-icon svg{width:52px;height:52px}
.scan-title{text-align:center;font-size:17px;font-weight:700;margin-bottom:3px}
.scan-sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:20px}
.scan-input{font-size:20px;padding:16px;text-align:center;border:2px solid var(--line);border-radius:12px;width:100%;letter-spacing:3px;font-family:ui-monospace,monospace;outline:none;background:#f0f9ff;font-weight:700;transition:.15s}
.scan-input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(2,132,199,.12)}
.scan-submit{margin-top:10px;padding:15px;font-size:14px;width:100%;justify-content:center}
.scan-result{margin-top:18px;min-height:200px;display:flex;align-items:center;justify-content:center}
.result{border-radius:16px;padding:22px 18px;width:100%;text-align:center;animation:pop .3s}
.result.ok{background:linear-gradient(135deg,#e0f2fe,#bae6fd);border:2px solid #0284c7}
.result.warn{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid #f59e0b}
.result.err{background:linear-gradient(135deg,#fee2e2,#fecaca);border:2px solid #ef4444}
.result .photo{width:120px;height:120px;border-radius:50%;margin:0 auto 14px;overflow:hidden;border:4px solid #fff;background:#0284c7;color:#fff;display:grid;place-items:center;font-size:40px;font-weight:800;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.result .photo img{width:100%;height:100%;object-fit:cover}
.result .nama{font-size:20px;font-weight:700;margin-bottom:3px;letter-spacing:-.3px}
.result .kelas{font-size:13px;color:#334155;font-weight:600;margin-bottom:2px}
.result .nis{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;margin-bottom:12px}
.result .status{display:inline-block;padding:7px 18px;border-radius:22px;font-weight:700;font-size:12.5px;letter-spacing:.8px;color:#fff}
.result .status.ok{background:#0284c7}.result .status.warn{background:#f59e0b}.result .status.err{background:#ef4444}
.result .msg-err{font-size:17px;font-weight:700;color:#991b1b;margin-bottom:6px}
.result .code{font-size:11.5px;color:#7f1d1d;font-family:ui-monospace,monospace;background:#fff;padding:5px 12px;border-radius:6px;display:inline-block}
.scan-hint{color:var(--muted);font-size:12.5px;text-align:center;line-height:1.6}

.recent-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.recent-count{background:#0f172a;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.recent-list{max-height:500px;overflow-y:auto}
.recent-item{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
.recent-item:last-child{border-bottom:none}
.recent-info{flex:1;min-width:0}
.recent-info b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-info span{font-size:11px;color:var(--muted)}
.recent-jam{font-size:11.5px;color:var(--blue);font-weight:700;font-family:ui-monospace,monospace}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:13px}
.empty-hint{color:var(--muted);font-size:12.5px;padding:8px 4px}

.search-results{margin-top:12px;max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.sr-item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #f1f5f9;transition:.15s;cursor:pointer}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:#f8fafc}
.sr-item .info{flex:1;min-width:0}
.sr-item .info b{display:block;font-size:13.5px;font-weight:600}
.sr-item .info span{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.sr-item .acts{display:flex;gap:5px}
.ab-sm{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:12px;font-family:inherit;transition:.15s;color:#475569}
.ab-sm:hover{border-color:#94a3b8;transform:translateY(-1px)}
.ab-sm.H{background:var(--green);color:#fff;border-color:transparent}
.ab-sm.S{background:var(--yellow);color:#fff;border-color:transparent}
.ab-sm.I{background:#3b82f6;color:#fff;border-color:transparent}
.ab-sm.A{background:var(--red);color:#fff;border-color:transparent}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stats-card{border-radius:14px;padding:16px;color:#fff;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 12px rgba(15,23,42,.08)}
.stats-card .lbl{font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;opacity:.92}
.stats-card .val{font-size:25px;font-weight:800;line-height:1;letter-spacing:-.5px}
.sc-orange{background:linear-gradient(135deg,#ea580c,#c2410c)}
.sc-green{background:linear-gradient(135deg,#0f172a,#1e293b)}
.sc-yellow{background:linear-gradient(135deg,#eab308,#ca8a04)}
.sc-teal{background:linear-gradient(135deg,#334155,#1e293b)}
.sc-blue{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.sc-red{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.sc-purple{background:linear-gradient(135deg,#7c3aed,#6d28d9)}

.filter-bar{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.filter-bar .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.filter-bar label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.filter-bar input,.filter-bar select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-family:inherit;width:100%;outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(2,132,199,.1)}

.tg{display:none;width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;place-items:center;color:var(--blue)}.tg svg{width:20px;height:20px}
@media(max-width:900px){
  body:not(.role-wali) .side{position:fixed;left:-260px;transition:.25s;z-index:100}
  body:not(.role-wali) .side.open{left:0}
  body:not(.role-wali) .side.open{box-shadow:0 0 40px rgba(0,0,0,.3)}
  .tg{display:grid}
  .content{padding:18px 14px}
  .top{padding:10px 14px}
}
@media(max-width:600px){
  table{font-size:12px}
  th{padding:8px 8px;font-size:9.5px}
  td{padding:8px 8px}
  .content{padding:14px 10px}
  .content h2{font-size:18px}
  .card{padding:14px}
  .btn{padding:9px 13px;font-size:12.5px}
  .modal .panel{padding:18px}
}

.mini-stat{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:600}
.badge-aktif{background:#dbeafe;color:#1e40af;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600}
.badge-inaktif{background:#f1f5f9;color:#64748b;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600}
.row-inaktif{opacity:.55}
.import-hint{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:14px;line-height:1.6}

.chip .x{width:14px;height:14px;border-radius:50%;background:rgba(3,105,161,.15);display:grid;place-items:center;cursor:pointer;font-size:10px;font-weight:700}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.info-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh);transition:.15s}

.aksi-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.aksi-btn.on{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(8,145,178,.25)}

.pil-mapel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:8px}
.pil-mapel-card{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff;cursor:pointer;font-family:inherit;text-align:left;transition:.15s;box-shadow:var(--sh)}
.pil-mapel-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 20px rgba(2,132,199,.15)}
.pil-mapel-card .jm{font-size:14.5px;font-weight:700;color:var(--dark);margin-bottom:4px}
.pil-mapel-card .jk{font-size:11.5px;color:var(--muted)}
.pil-mapel-card .jbadge{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:600;background:#dbeafe;color:#1e40af}

.row-absen{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #f1f5f9;transition:.12s}
.row-absen:last-child{border-bottom:none}
.row-absen:hover{background:#f8fafc}
.row-absen .nama{flex:1;min-width:0;font-weight:600;font-size:13.5px}
.row-absen .nis{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.absen-btns{display:flex;gap:6px;flex-shrink:0}
.absb{width:38px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:12.5px;font-family:inherit;transition:.15s;color:#475569}
.absb:hover{border-color:#94a3b8;transform:translateY(-1px)}
.absb.H.on{background:var(--green);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(5,150,105,.3)}
.absb.S.on{background:var(--yellow);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(217,119,6,.3)}
.absb.I.on{background:#3b82f6;color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(59,130,246,.3)}
.absb.A.on{background:var(--red);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(220,38,38,.3)}

.sticky-confirm{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:16px 20px;margin:0 -18px -18px;border-radius:0 0 var(--r) var(--r);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 -8px 20px rgba(15,23,42,.06);z-index:5}
.sticky-confirm .sum{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}

@media print{
  .side,.top,.aksi-row,.tb,.bottom-nav,.no-print{display:none !important}
  .content{padding:0;max-width:100%}
  .card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
  body{background:#fff}
}

 --bg:#f3f7ff;--card:#ffffff;--line:#dbe7f7;--dark:#142d4e;--muted:#647b98;

}

const savDate=d=>new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
window.renderTabungan = async function renderTabungan(){

function savList(){
 const q=($('#savSearch')?.value||'').toLowerCase();const rows=savRows.filter(r=>(r.nama+' '+r.kelas).toLowerCase().includes(q));
 $('#savList').innerHTML=rows.length?rows.map(r=>`<div class="sav-item"><div style="display:flex;gap:12px;align-items:center"><div class="sav-avatar">${esc(r.nama.slice(0,2).toUpperCase())}</div><div><b>${esc(r.nama)}</b><div style="color:#64748b;font-size:12px">Kelas ${esc(r.kelas||'-')} · ${savDate(r.tanggal)}</div><b style="color:#0e7490">${savRp(r.nominal)}</b></div></div><div style="display:flex;gap:7px"><button class="act-btn" onclick="savForm(${r.id})"> Edit</button><button class="act-btn danger" onclick="savDelete(${r.id})">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada data tabungan</div>';

 root.querySelector('form').onsubmit=async e=>{e.preventDefault();const btn=root.querySelector('[type=submit]');btn.disabled=true;try{const data={nama:$('#savNama').value.trim(),nominal:Number($('#savNominal').value),kelas_id:Number($('#savKelas').value)};if(!data.nama||!Number.isSafeInteger(data.nominal)||data.nominal<=0||!data.kelas_id)throw Error('Lengkapi data dengan nominal rupiah yang valid');if(!confirm('Konfirmasi simpan tabungan '+data.nama+' sebesar '+savRp(data.nominal)+'?')){btn.disabled=false;return}if(id)await api.put('/api/tabungan/'+id,data);else await api.post('/api/tabungan',data);root.remove();toast('Tabungan berhasil disimpan',false,true);renderTabungan()}catch(err){toast(err.message,true);btn.disabled=false}};

async function savRekap(mode){
 savView=mode;['kelas','harian','mingguan','bulanan','tahunan'].forEach(k=>$('#savTab-'+k)?.classList.toggle('active',k===mode)); if($('#savClassPeriod')) $('#savClassPeriod').value=['kelas-harian','kelas-mingguan','kelas-bulanan','kelas-tahunan'].includes(mode)?mode:'kelas-harian';
 const el=$('#savRekap');if(!el)return;el.innerHTML='<div class="empty">Memuat rekap...</div>';
 try{const d=await api.get('/api/tabungan/rekap?mode='+mode);

 const rows=d.rows,latest=rows.at(-1),prev=rows.at(-2),curr=Number(latest?.total||0),old=Number(prev?.total||0),pct=old===0?(curr>0?100:0):(curr-old)/old*100;
 const max=Math.max(1,...rows.map(r=>Number(r.total)));el.innerHTML=`<div class="sav-kpis"><div class="sav-kpi"><small>${mode==='harian'?'Setoran hari terakhir':mode==='mingguan'?'Setoran minggu terakhir':mode==='tahunan'?'Setoran tahun terakhir':'Setoran bulan terakhir'}</small><strong>${savRp(curr)}</strong></div><div class="sav-kpi"><small>Perubahan dari periode sebelumnya</small><strong style="color:${pct>=0?'#059669':'#e11d48'}">${pct>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</strong></div></div><p style="color:#64748b;font-size:12px">Grafik jumlah setoran per ${mode==='harian'?'hari':mode==='mingguan'?'minggu':mode==='tahunan'?'tahun':'bulan'} (bukan saldo kumulatif). Perbandingan berdasarkan dua periode terakhir yang tercatat.</p><div class="sav-bars">${rows.map(r=>`<div class="sav-bar-wrap"><b style="font-size:10px;color:#334155">${Number(r.total)>=1000000?(Number(r.total)/1000000).toFixed(1)+'jt':Number(r.total)>=1000?Math.round(Number(r.total)/1000)+'rb':r.total}</b><div class="sav-bar" title="${savRp(r.total)}" style="height:${Math.max(3,Number(r.total)/max*125)}px"></div><small>${esc(mode==='harian'?savDate(r.periode):mode==='mingguan'?savDate(r.periode):mode==='tahunan'?r.periode:r.periode.slice(5)+'/'+r.periode.slice(2,4))}</small></div>`).join('')}</div>${rows.length?'':'<div class="empty">Belum ada data grafik</div>'}`;
 }catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}

function beep(freq, dur, type) {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = 0.12;
    o.start(); setTimeout(() => { o.stop(); c.close(); }, dur);
  } catch (e) {}
}

function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 400; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const ok = ['image/jpeg','image/jpg','image/png'];
    if (ok.indexOf(file.type.toLowerCase()) < 0) return reject(new Error('Hanya JPG/JPEG/PNG'));
    if (file.size > 5 * 1024 * 1024) return reject(new Error('Ukuran maks 5MB'));
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = h * maxDim / w; w = maxDim; }
        else if (h > maxDim) { w = w * maxDim / h; h = maxDim; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Gagal baca gambar'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Gagal baca file'));
    reader.readAsDataURL(file);
  });
}

function cekRentangAbsen(jamMulai, batasAkhir, label) {

  if (jamMulai && now < jamMulai) return { ok: false, msg: ' ' + label + ' belum dibuka. Mulai jam ' + jamMulai + ' (sekarang ' + now + ')' };
  if (batasAkhir && now > batasAkhir) return { ok: false, msg: ' ' + label + ' sudah ditutup. Batas jam ' + batasAkhir + ' (sekarang ' + now + ')' };
  return { ok: true, now, msg: ' ' + label + ' DIBUKA — ' + now + ' (jam ' + jamMulai + ' s/d ' + batasAkhir + ')' };
}

    if (appCfg.appName) { $('#brandName').textContent = appCfg.appName; document.title = appCfg.appName; }
    if (appCfg.lembaga) $('#brandSub').textContent = appCfg.lembaga;
    if (appCfg.tahunPelajaran) $('#tapel').textContent = 'Tapel ' + appCfg.tahunPelajaran;
  } catch (e) {}

  try { appSetting = await api.get('/api/setting'); } catch (e) {}

  if (me.role === 'wali') document.body.classList.add('role-wali');
  else document.body.classList.remove('role-wali');

  tick();
  // Jangan tahan tampilan awal menunggu enam daftar master. Muat di latar belakang.
  loadCommon().catch(e => console.warn('Data master belum dimuat:', e?.message || 'error'));

  try {
    if (me.role === 'wali') {
      waliGoHome();
    } else {
      const route = pathToRoute(location.pathname);
      go(route || 'dashboard', false);
    }
  } catch (e) {
    console.error(e);
    $('#c').innerHTML = '<div class="card">Error: ' + esc(e.message) + '</div>';
  }
}

let aktivitasPage = 1;
async function renderAktivitas(page = 1) {
  if (!me || me.role !== 'admin') {
    const pv = $('#pv');
    if (pv) pv.innerHTML = '<div class="card"><div class="empty">Riwayat aktivitas hanya dapat diakses Admin.</div></div>';
    return;
  }
  aktivitasPage = Math.max(1, Number(page) || 1);
  const pv = $('#pv');
  if (!pv) return;
  pv.innerHTML = '<div class="card"><div class="loading-line"></div><div class="loading-line short"></div><p style="color:var(--muted);margin-top:12px">Memuat riwayat aktivitas…</p></div>';
  try {
    const result = await api.get('/api/aktivitas?page=' + aktivitasPage + '&limit=30');
    const rows = Array.isArray(result) ? result : (result.rows || []);
    const total = Number(result.total || rows.length || 0);
    const limit = Number(result.limit || 30);
    const current = Number(result.page || aktivitasPage);
    const pages = Math.max(1, Math.ceil(total / limit));
    const verbLabel = {POST:'Tambah / simpan', PUT:'Perbarui', PATCH:'Perbarui', DELETE:'Hapus', GET:'Lihat'};
    let body = '';
    rows.forEach(a => {
      const status = a.hasil === 'Tidak berhasil' ? 400 : 200;
      const badge = status >= 400 ? 'br' : status >= 300 ? 'by' : 'bg';
      const detail = a.detail || 'Perubahan data tersimpan';
      body += '<tr><td style="white-space:nowrap">' + esc(a.created_at ? new Date(a.created_at).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}) : '-') + '</td>' +
        '<td><b>' + esc(a.nama || a.username || 'Pengguna') + '</b><div style="font-size:11px;color:var(--muted)">' + esc(a.username || '-') + '</div></td>' +
        '<td><span class="bdg bb">' + esc(a.action || verbLabel[a.method] || a.method || 'Aktivitas') + '</span></td>' +
        '<td>' + esc(a.menu || 'Data sekolah') + '</td>' +
        '<td style="min-width:180px;max-width:360px;overflow-wrap:anywhere">' + esc(detail) + '</td>' +
        '<td><span class="bdg ' + badge + '">' + esc(a.hasil || (status >= 400 ? 'Tidak berhasil' : 'Berhasil')) + '</span></td></tr>';
    });
    if (!body) body = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">Belum ada riwayat aktivitas yang tercatat.</td></tr>';
    let pager = '';
    if (pages > 1) {
      pager = '<div class="activity-pager"><button class="btn btn-o btn-sm" ' + (current <= 1 ? 'disabled' : '') + ' onclick="renderAktivitas(' + (current-1) + ')">Sebelumnya</button><span>Halaman ' + current + ' dari ' + pages + ' · ' + total + ' aktivitas</span><button class="btn btn-o btn-sm" ' + (current >= pages ? 'disabled' : '') + ' onclick="renderAktivitas(' + (current+1) + ')">Berikutnya</button></div>';
    } else {
      pager = '<div class="activity-pager"><span>' + total + ' aktivitas tercatat</span><button class="btn btn-o btn-sm" onclick="renderAktivitas(' + current + ')">Muat ulang</button></div>';
    }
    pv.innerHTML = '<div class="activity-summary grid g3" style="margin-bottom:14px"><div class="card"><div class="activity-kicker">TOTAL AKTIVITAS</div><div class="activity-total">' + total.toLocaleString('id-ID') + '</div><div class="activity-note">Catatan perubahan melalui aplikasi</div></div><div class="card"><div class="activity-kicker">HALAMAN AKTIF</div><div class="activity-total">' + current + '<span style="font-size:15px;color:var(--muted)"> / ' + pages + '</span></div><div class="activity-note">30 catatan per halaman</div></div><div class="card"><div class="activity-kicker">KEAMANAN</div><div class="activity-total" style="font-size:21px">Aktif</div><div class="activity-note">Riwayat khusus administrator</div></div></div>' +
      '<div class="card"><div class="section-head"><div><h3 style="margin:0">Jejak Aktivitas</h3><p style="color:var(--muted);font-size:12px;margin-top:4px">Ringkasan perubahan data dan aktivitas pengguna.</p></div><button class="btn btn-p btn-sm" onclick="renderAktivitas(' + current + ')">Muat ulang</button></div><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Tindakan</th><th>Menu</th><th>Ringkasan perubahan</th><th>Hasil</th></tr></thead><tbody>' + body + '</tbody></table></div>' + pager + '</div>';
  } catch (e) {
    pv.innerHTML = '<div class="card"><h3>Riwayat aktivitas belum dapat dimuat</h3><p style="color:var(--muted);margin-bottom:12px">' + esc(e.message || 'Terjadi kesalahan saat mengambil data.') + '</p><button class="btn btn-p" onclick="renderAktivitas(' + aktivitasPage + ')">Coba lagi</button></div>';
  }
}

async function renderDashboard() {

  try {
    // Satu request ringkasan menggantikan tiga request yang sebelumnya membaca
    // banyak baris tabel dan membuat dashboard lambat pada serverless.
    const data = await api.get('/api/dashboard/overview?tanggal=' + todayLocal());
    const d = data.dashboard || {};
    const s = data.stat || {};
    const infoList = Array.isArray(data.informasi) ? data.informasi : [];
    const tglText = fmtTgl(todayLocal());
    const cards = [
      { key:'hadir', cls:'blue', lbl:'Hadir', val:s.hadir || 0 },
      { key:'telat', cls:'yellow', lbl:'Telat', val:s.telat || 0 },

      { key:'sakit', cls:'blue', lbl:'Sakit', val:s.sakit || 0 },
      { key:'izin', cls:'purple', lbl:'Izin', val:s.ijin || 0 },
      { key:'alpa', cls:'red', lbl:'Alpa', val:s.alpa || 0 },
      { key:'belum', cls:'gray', lbl:'Belum Absen', val:s.belum || 0 }
    ];
    const cardsHtml = cards.map(c => '<div class="stat ' + c.cls + '" onclick="showDashDetail(\''+c.key+'\',\''+c.lbl+'\')"><div class="lbl">' + c.lbl + '</div><div class="val">' + Number(c.val || 0) + '</div><div class="hint">Klik untuk detail</div></div>').join('');
    let infoHtml = '';
    if (infoList.length) {
      infoHtml = '<div class="info-grid">' + infoList.map(i => '<div class="info-card"><div class="thumb">' + (i.foto ? '<img loading="lazy" src="' + esc(i.foto) + '" alt="">' : 'Tanpa gambar') + '</div><div class="body"><div class="judul">' + esc(i.judul) + '</div>' + (i.deskripsi ? '<div class="desc">' + esc(i.deskripsi) + '</div>' : '') + '<div class="meta"><span>' + fmtTglPendek(i.tanggal || i.created_at) + '</span>' + ((me.role === 'admin' || me.role === 'guru') ? '<span>oleh ' + esc(i.user_nama || '-') + '</span>' : '') + '</div></div></div>').join('') + '</div>';

async function amDoSearch(q) {

    ]);

async function amSet(sid, status, el) {

let scanLock = false;
async function renderRFID() {
  try { appSetting = await api.get('/api/setting'); } catch (e) {}
  const jamMasuk = appSetting.jam_masuk || '07:00';

        '<div class="scan-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="12" r="2"/><path d="M5.5 8.5a8 8 0 0 0 0 7"/><path d="M8 6a11 11 0 0 0 0 12"/></svg></div>' +

        '<form onsubmit="prosesScan(event)">' +
          '<input id="scanInput" class="scan-input" autocomplete="off" placeholder="• • • • • •" autofocus>' +
          '<button type="submit" class="btn btn-p scan-submit">Submit Absen</button>' +

      '</div>' +

      '</div>' +
    '</div>';
  loadRecent();
  setTimeout(() => { const el = $('#scanInput'); if (el) el.focus(); }, 100);
}
async function prosesScan(e) {
  e.preventDefault(); if (scanLock) return;
  const inp = $('#scanInput'); const kode = inp.value.trim(); if (!kode) return;
  const cek = cekRentangAbsen(appSetting.jam_masuk || '07:00', appSetting.batas_pulang || '16:00', 'Absen');
  if (!cek.ok) {
    const r = $('#scanResult'); if (r) r.innerHTML = '<div class="result err"><div class="msg-err">Absen Ditutup</div><div style="color:#7f1d1d;font-size:12.5px;font-weight:600;margin-top:6px">' + cek.msg.replace(' ','') + '</div></div>';
    beepErr(); inp.value = ''; inp.focus(); return;
  }
  scanLock = true; inp.value = ''; inp.disabled = true;
  try {
    const res = await api.post('/api/absen/scan', { kode, tanggal: todayLocal() });
    tampilHasil(res); beepOK(); loadRecent();
  } catch (err) {
    if (err.status === 404) { tampilNotFound((err.data && err.data.kode) || kode); beepErr(); }
    else if (err.status === 403 && err.data && err.data.closed) {
      const r = $('#scanResult'); if (r) r.innerHTML = '<div class="result err"><div class="msg-err">Absen Ditutup</div><div style="color:#7f1d1d;font-size:12.5px;font-weight:600;margin-top:6px">' + esc(err.data.error) + '</div></div>';
      beepErr();
    }
    else if (err.status === 403 && err.data && err.data.sedang_izin) { tampilSedangIzin(err.data); beepErr(); }
    else { tampilError(err.message); beepErr(); }
  } finally { scanLock = false; inp.disabled = false; inp.focus(); }
}
function tampilHasil(r) {
  const s = r.siswa; const baru = r.status === 'baru';
  const cls = baru ? 'ok' : 'warn';
  const label = baru ? 'HADIR' : 'SUDAH ABSEN';
  const tl = r.status_masuk === 'telat' ? ' · TELAT' : '';
  const photoHtml = s.foto ? '<img src="' + esc(s.foto) + '">' : initials(s.nama);
  const el = $('#scanResult'); if (!el) return;
  el.innerHTML =
    '<div class="result ' + cls + '"><div class="photo">' + photoHtml + '</div>' +
    '<div class="nama">' + esc(s.nama) + '</div>' +
    '<div class="kelas">' + esc(s.kelas) + '</div>' +
    '<div class="nis">NIS ' + esc(s.nis) + '</div>' +
    '<div class="status ' + cls + '">' + label + tl + '</div>' +
    '<div style="font-size:12px;color:#475569;margin-top:8px;font-weight:600">' + r.jam + '</div></div>';
}
function tampilNotFound(kode) { const el = $('#scanResult'); if (el) el.innerHTML = '<div class="result err"><div class="msg-err">Murid tidak ditemukan</div><div class="code">' + esc(kode) + '</div></div>'; }
function tampilSedangIzin(d) {
  const iz = d.detail_izin;
  const photoHtml = d.siswa.foto ? '<img src="' + esc(d.siswa.foto) + '">' : initials(d.siswa.nama);
  let det = iz ? esc(iz.jenis) : 'Izin';
  const el = $('#scanResult'); if (!el) return;
  el.innerHTML = '<div class="result warn"><div class="photo">' + photoHtml + '</div><div class="nama">' + esc(d.siswa.nama) + '</div><div class="kelas">' + esc(d.siswa.kelas) + '</div><div class="status warn">SEDANG IZIN</div><div style="margin-top:10px;font-size:12.5px;color:#78350f;font-weight:600">' + det + '</div></div>';
}
function tampilError(msg) { const el = $('#scanResult'); if (el) el.innerHTML = '<div class="result err"><div class="msg-err">Terjadi kesalahan</div><div style="color:#7f1d1d;font-size:12px">' + esc(msg) + '</div></div>'; }
async function loadRecent() {
  try {
    const rows = await api.get('/api/absen/hari-ini?tanggal=' + todayLocal());
    const rc = $('#recentCount'); if (rc) rc.textContent = rows.length;
    const rl = $('#recentList'); if (!rl) return;
    if (!rows.length) { rl.innerHTML = '<div class="empty">Belum ada</div>'; return; }

      const tlat = r.status_masuk === 'telat' ? ' · TELAT' : '';
      html += '<div class="recent-item">' + avatar(r.siswa_id, r.nama, r.foto, 38) +
        '<div class="recent-info"><b>' + esc(r.nama) + '</b><span>' + esc(r.kelas) + ' · ' + esc(r.nis) + tlat + '</span></div>' +
        '<div class="recent-jam">' + esc(r.jam || '') + '</div></div>';
    });
    rl.innerHTML = html;
  } catch (e) {}
}

function renderAbsenPelList(listSiswa, saved) {
  const el = $('#absenPelList'); if (!el) return;
  if (!listSiswa.length) { el.innerHTML = '<div class="empty">Tidak ada siswa di kelas ini.</div>'; updateSum(); return; }
  let html = '';
  listSiswa.forEach(s => {
    const st = saved[s.id] || state.absenPelState[s.id] || '';
    state.absenPelState[s.id] = st;
    html += '<div class="row-absen">' +
      avatar(s.id, s.nama, s.foto, 36) +
      '<div class="nama">'+esc(s.nama)+'<div class="nis">NIS '+esc(s.nis)+'</div></div>' +
      '<div class="absen-btns">' +
        ['H','S','I','A'].map(x => '<button class="absb '+x+(st===x?' on':'')+'" data-siswa="'+s.id+'" data-set="'+x+'" onclick="setPelajaran('+s.id+',\''+x+'\',this)">'+x+'</button>').join('') +
      '</div></div>';
  });
  el.innerHTML = html; updateSum();
}
function setPelajaran(sid, status, btn) {
  if (state.absenPelState[sid] === status) {
    state.absenPelState[sid] = ''; btn.classList.remove('on');
  } else {
    state.absenPelState[sid] = status;
    btn.parentElement.querySelectorAll('.absb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  }
  updateSum();
}
function setAllPelajaran(status) {
  $$('#absenPelList .row-absen').forEach(row => {
    const btn = row.querySelector('.absb.' + status);
    if (btn) {
      const sid = +btn.dataset.siswa;
      state.absenPelState[sid] = status;
      row.querySelectorAll('.absb').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
    }
  });
  updateSum();
}
function clearAllPelajaran() {
  Object.keys(state.absenPelState).forEach(k => { state.absenPelState[k] = ''; });
  $$('#absenPelList .absb').forEach(b => b.classList.remove('on'));
  updateSum();
}
function updateSum() {
  const v = Object.values(state.absenPelState || {});
  const c = k => v.filter(x => x === k).length;
  const total = v.length, filled = v.filter(x => x).length;
  const setSum = (id, txt) => { const el = $(id); if (el) el.textContent = txt; };
  setSum('#sumH', 'H: ' + c('H'));
  setSum('#sumS', 'S: ' + c('S'));
  setSum('#sumI', 'I: ' + c('I'));
  setSum('#sumA', 'A: ' + c('A'));
  setSum('#sumN', 'Belum: ' + (total - filled));
}
async function simpanAbsenPelajaran() {
  const mapelId = state.pilMapelId;
  if (!mapelId) return toast('Mapel tidak ditemukan', true);
  const items = Object.entries(state.absenPelState || {})
    .filter(([sid, st]) => st).map(([sid, st]) => ({ siswa_id: +sid, status: st }));
  if (!items.length) return toast('Belum ada siswa yang dipilih', true);
  try {
    const res = await api.post('/api/absen-pelajaran', { mapel_id: +mapelId, tanggal: todayLocal(), items });
    toast('Absensi tersimpan: ' + res.saved + ' siswa', false, true);
  } catch (e) { toast(e.message, true); }
}

async function renderAbsensiExtraRFID() {

          '<button type="submit" class="btn btn-p scan-submit">Submit Absen</button>' +

      '</div>' +
      '<div class="card">' +
        '<div class="recent-header"><h3 style="margin:0">Absen Ekstra Hari Ini</h3><span class="recent-count" id="exRecentCount">0</span></div>' +
        '<div class="recent-list" id="exRecentList"><div class="empty">Belum ada</div></div>' +
      '</div>' +
    '</div>';
  loadExtraRecent();
  setTimeout(() => { const el = $('#scanExtraInput'); if (el) el.focus(); }, 100);
}
async function prosesScanExtra(e) {
  e.preventDefault(); if (scanExtraLock) return;
  const inp = $('#scanExtraInput'); const kode = inp.value.trim(); if (!kode) return;
  const cek = cekRentangAbsen(appSetting.jam_extra_masuk || '14:00', appSetting.batas_extra_pulang || '18:00', 'Absen ekstra');
  if (!cek.ok) {
    const r = $('#scanExtraResult'); if (r) r.innerHTML = '<div class="result err"><div class="msg-err">Absen Ditutup</div><div style="color:#7f1d1d;font-size:12.5px;font-weight:600;margin-top:6px">' + cek.msg.replace(' ','') + '</div></div>';
    beepErr(); inp.value = ''; inp.focus(); return;
  }
  const ekstra_id = +$('#exEks').value;
  scanExtraLock = true; inp.value = ''; inp.disabled = true;
  try {
    const res = await api.post('/api/absen-extra/scan', { kode, ekstra_id, tanggal: todayLocal() });
    tampilHasilExtra(res); beepOK(); loadExtraRecent();
  } catch (err) {
    if (err.status === 404) { tampilNotFound((err.data && err.data.kode) || kode); beepErr(); }
    else if (err.status === 403 && err.data && err.data.closed) {
      const r = $('#scanExtraResult'); if (r) r.innerHTML = '<div class="result err"><div class="msg-err">Absen Ditutup</div><div style="color:#7f1d1d;font-size:12.5px;font-weight:600;margin-top:6px">' + esc(err.data.error) + '</div></div>';
      beepErr();
    }
    else { tampilErrorExtra(err.message); beepErr(); }
  } finally { scanExtraLock = false; inp.disabled = false; inp.focus(); }
}
function tampilErrorExtra(message) {
  const el = $('#scanExtraResult');
  if (!el) return;
  el.innerHTML = '<div class="result err"><div class="msg-err">Absen ekstra gagal</div><div style="font-size:12px;margin-top:8px">' + esc(message || 'Terjadi kesalahan. Coba lagi.') + '</div></div>';
}
function tampilHasilExtra(r) {
  const s = r.siswa;
  const cls = r.status === 'sudah' ? 'warn' : 'ok';
  const labels = { baru:'ABSEN MASUK TERCATAT', pulang:'ABSEN PULANG TERCATAT', sudah:'ABSEN MASUK & PULANG SUDAH LENGKAP' };
  const label = labels[r.status] || 'BERHASIL';
  const photoHtml = s.foto ? '<img src="'+esc(s.foto)+'">' : initials(s.nama);
  const el = $('#scanExtraResult'); if (!el) return;
  el.innerHTML =
    '<div class="result '+cls+'"><div class="photo">'+photoHtml+'</div>' +
    '<div class="nama">'+esc(s.nama)+'</div>' +
    '<div class="kelas">'+esc(s.kelas)+'</div>' +
    '<div class="nis">'+esc(r.ekstra)+'</div>' +
    '<div class="status '+cls+'">'+label+'</div>' +
    '<div style="font-size:12px;color:#475569;margin-top:8px;font-weight:600">'+r.jam+'</div></div>';
}
async function loadExtraRecent() {
  try {
    const rows = await api.get('/api/absen-extra/hari-ini?tanggal=' + todayLocal());
    const rc = $('#exRecentCount'); if (rc) rc.textContent = rows.length;
    const rl = $('#exRecentList'); if (!rl) return;
    if (!rows.length) { rl.innerHTML = '<div class="empty">Belum ada</div>'; return; }
    let html = '';
    rows.slice(0, 50).forEach(r => {

async function loadPerizinanRiwayat() {
  const q = new URLSearchParams();
  q.set('dari', $('#izdDari').value); q.set('sampai', $('#izdSampai').value);
  if ($('#izdStatus').value) q.set('status', $('#izdStatus').value);
  const rows = await api.get('/api/izin?' + q.toString());
  state.izRows = rows;
  const el = $('#izdBody'); if (!el) return;
  if (!rows.length) { el.innerHTML = '<div class="empty">Tidak ada data</div>'; return; }
  const map = {};
  rows.forEach(r => { const key = r.siswa_id + '|' + r.tanggal; if (!map[key]) map[key] = []; map[key].push(r); });
  Object.values(map).forEach(arr => { arr.sort((a,b) => String(a.created_at||'').localeCompare(String(b.created_at||''))); arr.forEach((r,i) => { r._aktif = i === arr.length-1 && r.status === 'pergi'; }); });
  let html = '';
  rows.forEach(r => {
    let st;
    if (r._aktif) st = '<span class="bdg by">Sedang Izin</span>';
    else if (r.status === 'pergi') st = '<span class="bdg bgr">Pergi (lalu)</span>';
    else st = '<span class="bdg bg">Kembali</span>';
    const aksi = (r._aktif ? '<button class="act-btn" onclick="izKembalikan('+r.id+')">Kembalikan</button> ' : '') + '<button class="act-btn danger" onclick="hapusIzin('+r.id+',this)">Hapus</button>';
    html += '<tr><td style="font-family:ui-monospace;font-size:11.5px">'+esc(r.tanggal)+'</td>' +
      '<td style="font-weight:600">'+esc(r.nama_siswa)+'</td>' +
      '<td><span class="bdg bgr">'+esc(r.kelas)+'</span></td>' +
      '<td>'+esc(r.jenis)+'</td><td>'+st+'</td>' +
      '<td style="font-size:11.5px;color:var(--muted)">'+esc(r.keterangan||'-')+'</td>' +
      '<td>'+aksi+'</td></tr>';
  });
  el.innerHTML = '<div style="overflow-x:auto"><table id="izdTable"><thead><tr><th>Tanggal</th><th>Nama</th><th>Kelas</th><th>Jenis</th><th>Status</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody>'+html+'</tbody></table></div>';
}

  const headers = ['Tanggal','Nama','Kelas','NIS','Jenis','Status','Keterangan'];

async function loadDataSiswa() {
  const q = new URLSearchParams();
  if (state.dsFilter.kelas_id) q.set('kelas_id', state.dsFilter.kelas_id);
  if (state.dsFilter.q) q.set('q', state.dsFilter.q);
  if (state.dsFilter.status === 'aktif') q.set('hanya_aktif', '1');
  let rows = await api.get('/api/siswa?' + q.toString());
  if (state.dsFilter.status === 'nonaktif') rows = rows.filter(r => !r.aktif);
  state.dsRows = rows;
  const countEl = $('#dsCount'); if (countEl) countEl.textContent = rows.length + ' siswa';
  const el = $('#dsBody'); if (!el) return;
  if (!rows.length) { el.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:26px;color:var(--muted)">Belum ada data</td></tr>'; return; }
  let html = '';
  rows.forEach((s, i) => {
    const n = esc(s.nama).replace(/'/g, "\\'");
    html += '<tr class="'+(s.aktif?'':'row-inaktif')+'"><td>'+(i+1)+'</td>' +
      '<td>'+avatar(s.id, s.nama, s.foto, 34)+'</td>' +

    '<div class="import-hint">Format: .xls / .xlsx / .csv. Header baris pertama:<br><code>nis, nisn, nama, kelas, rfid, jenis_kelamin, tempat_lahir, tanggal_lahir, no_hp, no_hp_ayah, no_hp_ibu, no_rekening, no_induk</code><br>Wajib: <b>nis, nama</b>.</div>' +

}
let imRows = [];
function previewExcel(inp) {
  const f = inp.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
      imRows = json.map(r => ({
        nis:String(r.nis||r.NIS||'').trim(), nisn:String(r.nisn||r.NISN||'').trim(),
        nama:String(r.nama||r.Nama||'').trim(), kelas:String(r.kelas||r.Kelas||'').trim(),
        rfid:String(r.rfid||r.RFID||'').trim(), jenis_kelamin:String(r.jenis_kelamin||r.jk||'').trim(),
        tempat_lahir:String(r.tempat_lahir||'').trim(), tanggal_lahir:String(r.tanggal_lahir||'').trim(),
        no_hp:String(r.no_hp||'').trim(), no_hp_ayah:String(r.no_hp_ayah||'').trim(),
        no_hp_ibu:String(r.no_hp_ibu||'').trim(), no_rekening:String(r.no_rekening||'').trim(),
        no_induk:String(r.no_induk||'').trim()
      }));
      const el = $('#imPreview'); if (!el) return;
      if (!imRows.length) { el.innerHTML = '<div class="empty">Tidak ada data</div>'; return; }
      let rows = '';
      imRows.slice(0, 5).forEach(r => { rows += '<tr><td>'+esc(r.nis)+'</td><td>'+esc(r.nama)+'</td><td>'+esc(r.kelas)+'</td></tr>'; });
      el.innerHTML = '<div style="font-size:12.5px;margin-bottom:6px">Ditemukan <b>'+imRows.length+'</b> baris:</div><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th></tr></thead><tbody>'+rows+'</tbody></table>';
      $('#imBtn').disabled = false;
    } catch (err) { toast('Gagal baca file: '+err.message, true); }
  };
  reader.readAsArrayBuffer(f);
}
async function doImportExcel() {
  if (!imRows.length) return;
  try {
    const res = await api.post('/api/siswa/import', { rows: imRows });
    toast('Import: '+res.sukses+' sukses'+(res.gagal?', '+res.gagal+' gagal':''), res.gagal > 0, res.gagal === 0);
    $('#mImp').remove(); imRows = [];
    await loadCommon(true); loadDataSiswa();
  } catch (e) { toast(e.message, true); }
}

async function bkSimpan() {

      '<button class="aksi-btn'+(mode==='izin'?' on':'')+'" onclick="setOrtuMode(\'izin\',this)"><svg class="mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg> Perizinan</button>' +
      '<button class="aksi-btn'+(mode==='extra'?' on':'')+'" onclick="setOrtuMode(\'extra\',this)"><svg class="mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Absensi Extra</button>' +
      '<button class="aksi-btn'+(mode==='pelanggaran'?' on':'')+'" onclick="setOrtuMode(\'pelanggaran\',this)"><svg class="mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4m0 4h.01"/></svg> Pelanggaran</button>' +
      '<button class="aksi-btn'+(mode==='nilai'?' on':'')+'" onclick="setOrtuMode(\'nilai\',this)"><svg class="mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5"/></svg> Nilai</button>' +
    '</div>' +
    '<div id="ortuBody" class="card"><div class="empty">Memuat…</div></div>';
  await loadOrtuBody();
}
function ubahHalamanAbsensiWali(page) { state.ortuAbsensiPage = Math.max(1, Number(page)||1); loadOrtuBody(); }
function setOrtuMode(mode, btn) {
  state.ortuMode = mode; if (mode === 'sekolah') state.ortuAbsensiPage = 1;
  $$('#ortuContent .aksi-btn').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  loadOrtuBody();
}
async function loadOrtuBody() {
  const sid = state.ortuAnakAktif;
  const anak = (state.ortuAnak || []).find(a => a.id === sid);
  const mode = state.ortuMode || 'sekolah';
  const body = $('#ortuBody');
  if (!body || !anak) return;
  body.innerHTML = '<div class="empty">Memuat…</div>';
  try {
    if (mode === 'sekolah') {
      const page = Math.max(1, Number(state.ortuAbsensiPage || 1));
      const data = await api.get('/api/wali/anak/' + sid + '/absensi?page=' + page);
      const rows = data.rows || [];
      const byDate = new Map(rows.map(a => [String(a.tanggal).slice(0,10), a]));
      const days = [];
      for (let i=0;i<7;i++) { const d = new Date(data.end+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-i); days.push(d.toISOString().slice(0,10)); }
      let html = '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px"><h3 style="margin:0">Absensi Sekolah · '+esc(anak.nama)+'</h3><span style="font-size:12px;color:var(--muted)">'+esc(data.start)+' s.d. '+esc(data.end)+'</span></div>' +
        '<div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Jam Masuk</th><th>Jam Pulang</th><th>Status</th></tr></thead><tbody>';
      days.forEach(tanggal => { const a = byDate.get(tanggal); if (!a) { html += '<tr><td style="font-family:ui-monospace;font-size:11.5px">'+tanggal+'</td><td>—</td><td>—</td><td><span class="bdg bgr">Belum ada data</span></td></tr>'; return; }
        let st, cls;
        if (a.status === 'H') { if (a.status_masuk === 'telat') { st = 'Terlambat'; cls = 'by'; } else { st = 'Tepat Waktu'; cls = 'bg'; } }
        else if (a.status === 'S') { st = 'Sakit'; cls = 'bp'; }
        else if (a.status === 'I') { st = 'Izin'; cls = 'bb'; }
        else if (a.status === 'A') { st = 'Alpa'; cls = 'br'; }
        else { st = '-'; cls = 'bgr'; }
        html += '<tr><td style="font-family:ui-monospace;font-size:11.5px">'+esc(a.tanggal)+'</td>' +
          '<td style="font-family:ui-monospace;font-size:11.5px">'+esc(a.jam||'-')+'</td>' +
          '<td style="font-family:ui-monospace;font-size:11.5px">'+esc(a.jam_pulang||'-')+'</td>' +
          '<td><span class="bdg '+cls+'">'+st+'</span></td></tr>';
      });
      html += '</tbody></table></div><div class="week-pager"><button class="btn btn-o btn-sm" '+(page<=1?'disabled':'')+' onclick="ubahHalamanAbsensiWali('+Math.max(1,page-1)+')">‹ Minggu terbaru</button><div class="week-pages">';
      for (let p=Math.max(1,page-2);p<=Math.min(data.maxPage||1,page+2);p++) { html += '<button class="week-page '+(p===page?'active':'')+'" onclick="ubahHalamanAbsensiWali('+p+')">'+p+'</button>'; }
      html += '<button class="btn btn-o btn-sm" '+(!data.hasOlder || page >= (data.maxPage||1)?'disabled':'')+' onclick="ubahHalamanAbsensiWali('+(page+1)+')">Minggu sebelumnya ›</button></div>'; 
      body.innerHTML = html;
    } else if (mode === 'pelajaran') {
      const rows = await api.get('/api/wali/anak/' + sid + '/pelajaran');
      if (!rows.length) { body.innerHTML = '<div class="empty">Belum ada absensi pelajaran.</div>'; return; }
      let html = '<h3 style="margin-bottom:12px">Absen Pelajaran · '+esc(anak.nama)+'</h3>' +
        '<div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Mata Pelajaran</th><th>Status</th></tr></thead><tbody>';
      rows.slice(0, 80).forEach(a => {
        let st, cls;
        if (a.status === 'H') { st = 'Hadir'; cls = 'bg'; }
        else if (a.status === 'S') { st = 'Sakit'; cls = 'bp'; }
        else if (a.status === 'I') { st = 'Izin'; cls = 'bb'; }
        else if (a.status === 'A') { st = 'Alpa'; cls = 'br'; }
        else { st = '-'; cls = 'bgr'; }
        html += '<tr><td style="font-family:ui-monospace;font-size:11.5px">'+esc(a.tanggal)+'</td>' +
          '<td style="font-weight:600">'+esc(a.mapel)+'</td>' +
          '<td><span class="bdg '+cls+'">'+st+'</span></td></tr>';
      });
      html += '</tbody></table></div>';
      body.innerHTML = html;
    } else if (mode === 'izin') {
      const rows = await api.get('/api/wali/anak/' + sid + '/izin');
      if (!rows.length) { body.innerHTML = '<div class="empty">Belum ada riwayat izin.</div>'; return; }
      let html = '<h3 style="margin-bottom:12px">Perizinan · '+esc(anak.nama)+'</h3>' +
        '<div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Status</th><th>Ket</th></tr></thead><tbody>';
      rows.slice(0, 60).forEach(z => {
        const st = z.status === 'pergi' ? '<span class="bdg by">Pergi</span>' : '<span class="bdg bg">Kembali</span>';
        html += '<tr><td style="font-family:ui-monospace;font-size:11.5px">'+esc(z.tanggal)+'</td>' +
          '<td>'+esc(z.jenis)+'</td><td>'+st+'</td>' +
          '<td style="font-size:11.5px;color:var(--muted)">'+esc(z.keterangan||'-')+'</td></tr>';
      });
      html += '</tbody></table></div>';
      body.innerHTML = html;
    } else if (mode === 'extra') {
      const rows = await api.get('/api/wali/anak/' + sid + '/extra');
      if (!rows.length) { body.innerHTML = '<div class="empty">Belum ada absensi ekstra.</div>'; return; }
      let html = '<h3 style="margin-bottom:12px">Absensi Extra · '+esc(anak.nama)+'</h3>' +
        '<div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Ekstra</th><th>Masuk</th><th>Pulang</th></tr></thead><tbody>';
      rows.slice(0, 60).forEach(a => {
        html += '<tr><td style="font-family:ui-monospace;font-size:11.5px">'+esc(a.tanggal)+'</td>' +
          '<td><span class="bdg bt">'+esc(a.ekstra_nama)+'</span></td>' +
          '<td style="font-family:ui-monospace;font-size:11.5px">'+esc(a.jam_masuk||'-')+'</td>' +
          '<td style="font-family:ui-monospace;font-size:11.5px">'+esc(a.jam_pulang||'-')+'</td></tr>';
      });
      html += '</tbody></table></div>';
      body.innerHTML = html;
    } else if (mode === 'pelanggaran') {
      const rows = await api.get('/api/wali/anak/' + sid + '/pelanggaran');
      if (!rows.length) { body.innerHTML = '<div class="guardian-status good"><h3>Tidak ada pelanggaran</h3><p>Tidak ada catatan pelanggaran pada anak Anda.</p></div>'; return; }
      let html = '<h3 style="margin-bottom:12px">Catatan Pelanggaran · '+esc(anak.nama)+'</h3><div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Pelanggaran</th><th>Poin</th><th>Keterangan</th></tr></thead><tbody>';
      rows.forEach(r => { html += '<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.jenis||'-')+'</td><td><b>'+esc(r.poin||0)+'</b></td><td>'+esc(r.keterangan||'-')+'</td></tr>'; });
      body.innerHTML = html+'</tbody></table></div>';
    } else if (mode === 'nilai') {
      const rows = await api.get('/api/wali/anak/' + sid + '/nilai');
      if (!rows.length) { body.innerHTML = '<div class="empty">Belum ada nilai yang diinput sekolah.</div>'; return; }
      let html = '<h3 style="margin-bottom:12px">Nilai Akademik · '+esc(anak.nama)+'</h3><div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Mata Pelajaran</th><th>Jenis</th><th>Nilai</th></tr></thead><tbody>';
      rows.sort((a,b)=>String(b.tanggal||'').localeCompare(String(a.tanggal||''))).forEach(r => { const score=Number(r.nilai||0); const color=score>=75?'#047857':score>=60?'#b45309':'#b91c1c'; html += '<tr><td>'+esc(r.tanggal||'-')+'</td><td>'+esc(r.mapel||'-')+'</td><td>'+esc(String(r.jenis||'harian').toUpperCase())+'</td><td><b style="color:'+color+'">'+score+'</b></td></tr>'; });
      body.innerHTML = html+'</tbody></table></div>';
    }
  } catch (e) { body.innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>'; }
}
function renderWaliSettings() {
  const c = $('#c'); if (!c) return;
  c.innerHTML =
    '<h2 style="font-size:18px;font-weight:700;margin-bottom:4px">Settings</h2>' +
    '<p class="sub" style="color:var(--muted);font-size:12.5px;margin-bottom:14px">Pengaturan akun</p>' +
    '<div class="card" style="margin-bottom:14px">' +
      '<h3>Ganti Password</h3>' +
      '<p style="font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:14px">Gunakan minimal 8 karakter agar akun lebih aman.</p>' +
      '<div class="f"><label>Password Baru</label><input type="password" id="newPwd" minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter"></div>' +
      '<div class="f"><label>Ulangi Password</label><input type="password" id="newPwdConfirm" minlength="8" autocomplete="new-password" placeholder="Ulangi password baru"></div>' +
      '<button class="btn btn-g" style="width:100%;justify-content:center;padding:12px" onclick="doGantiPwd()">Simpan Password</button>' +
    '</div>' +
    '<div class="card">' +
      '<h3>Logout</h3>' +
      '<p style="font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:14px">Keluar dari akun ini.</p>' +
      '<button class="btn btn-r" style="width:100%;justify-content:center;padding:12px" onclick="logout()">Logout</button>' +
    '</div>';
}
async function doGantiPwd() {
  const p = $('#newPwd').value.trim();
  const pc = $('#newPwdConfirm').value.trim();
  if (!p || p.length < 8) return toast('Password baru harus minimal 8 karakter.', true);
  if (p !== pc) return toast('Ulangi password tidak cocok', true);
  try {
    await api.post('/api/auth/ganti-password', { password_baru: p });
    toast('Password berhasil diganti', false, true);
    $('#newPwd').value = ''; $('#newPwdConfirm').value = '';
  } catch (e) { toast(e.message, true); }
}

/* ============ BIND SEARCH ============ */
function bindSiswaSearch(inputSel, hasilSel, cb) {
  const el = $(inputSel); if (!el) return;
  let timer;
  el.addEventListener('input', function () {
    clearTimeout(timer);
    const v = this.value.trim();
    if (v.length < 2) { const h = $(hasilSel); if (h) h.innerHTML = ''; return; }
    timer = setTimeout(async () => {
      const rows = await api.get('/api/siswa/cari?q=' + encodeURIComponent(v));
      const h = $(hasilSel); if (!h) return;
      if (!rows.length) { h.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:6px">Tidak ditemukan</div>'; return; }
      let html = '';
      rows.slice(0, 8).forEach(s => {
        html += '<div class="check-item" onclick="__pickSiswa('+s.id+',\''+hasilSel+'\')">'+avatar(s.id,s.nama,s.foto,30)+'<div class="info"><b>'+esc(s.nama)+'</b><span>'+esc(s.kelas)+' · '+esc(s.nis)+'</span></div></div>';
      });
      h.innerHTML = html;
      window.__pickSiswaCb = cb;
    }, 250);
  });
}
window.__pickSiswa = function(id, hasilSel) {
  const h = $(hasilSel); if (h) h.innerHTML = '';
  if (window.__pickSiswaCb) window.__pickSiswaCb(id);
};

/* ============ INIT ============ */
(function init() {
  tick();
  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok || !d.id) {
        location.href = '/login.html';
        return;
      }
      boot();
    }).catch(() => { location.href = '/login.html'; });
})();
</script>
