<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk · Sistem Absensi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at top left,#2563eb 0%,#102d62 48%,#071a3b 100%);
  padding:24px;position:relative;overflow:hidden;
}
body::before,body::after{
  content:'';position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none;
}
body::before{width:520px;height:520px;background:radial-gradient(circle,#60a5fa,transparent 70%);top:-180px;left:-180px;animation:float1 12s ease-in-out infinite;}
body::after{width:520px;height:520px;background:radial-gradient(circle,#2563eb,transparent 70%);bottom:-200px;right:-180px;animation:float2 14s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-40px)}}

.login-wrap{position:relative;z-index:2;width:100%;max-width:440px}
.logo-badge{
  display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:28px;
}
.logo-badge .ic{
  width:60px;height:60px;border-radius:18px;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 12px 32px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.3);
}
.logo-badge h1{color:#fff;font-size:20px;font-weight:800;letter-spacing:-.4px}
.logo-badge p{color:#94a3b8;font-size:12px;font-weight:500;margin-top:2px}

.card{
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;padding:36px 32px;
  box-shadow:0 24px 64px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
}
.card h2{color:#fff;font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
.card .sub{color:#94a3b8;font-size:13.5px;margin-bottom:26px}

.field{margin-bottom:18px}
.field label{display:block;color:#cbd5e1;font-size:12.5px;font-weight:600;margin-bottom:8px;letter-spacing:.2px}
.field .input-wrap{position:relative}
.field .ic{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;opacity:.65;pointer-events:none;color:#94a3b8;
}
.field input{
  width:100%;padding:15px 16px 15px 46px;
  background:rgba(15,23,42,.5);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;color:#fff;font-size:14.5px;
  font-family:inherit;outline:none;transition:.2s;
}
.field input::placeholder{color:#64748b}
.field input:focus{
  border-color:#60a5fa;background:rgba(15,23,42,.75);
  box-shadow:0 0 0 4px rgba(34,211,238,.2);
}
.btn-masuk{
  width:100%;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px;
  cursor:pointer;font-family:inherit;transition:.25s;
  box-shadow:0 10px 26px rgba(34,211,238,.25);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-masuk:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(59,130,246,.35)}
.btn-masuk:active{transform:translateY(0)}
.btn-masuk:disabled{opacity:.6;cursor:wait;transform:none}

.err{
  background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);
  color:#fca5a5;padding:12px 14px;border-radius:12px;
  font-size:13px;margin-bottom:18px;display:none;
  animation:shake .35s;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.foot{text-align:center;margin-top:22px;color:#64748b;font-size:12px}
.foot b{color:#94a3b8}

.hint{
  margin-top:20px;padding:12px 16px;border-radius:12px;
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.2);
  color:#a5f3fc;font-size:12px;text-align:center;line-height:1.6;
}
.hint code{background:rgba(14,165,233,.15);padding:2px 6px;border-radius:5px;font-family:monospace;color:#e0f2fe}

/* Small physical screens: remain readable even when the browser requests Desktop site. */
@media (max-device-width: 600px) {
  body { padding: 18px !important; min-height: 100svh; }
  .login-wrap { width: 100% !important; max-width: 440px !important; }
  .logo-badge { margin-bottom: 20px !important; gap: 12px !important; }
  .logo-badge .ic { width: 48px !important; height: 48px !important; border-radius: 14px !important; }
  .logo-badge h1 { font-size: 18px !important; }
  .card { padding: 24px 20px !important; border-radius: 20px !important; }
  .card h2 { font-size: 21px !important; }
  .field input { min-height: 48px; font-size: 16px !important; }
  .btn-masuk { min-height: 48px; }
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-badge">
    <div class="ic"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-5 10 5-10 5L2 9Z"/><path d="M6 11v5c3.5 3 8.5 3 12 0v-5M22 9v6"/></svg></div>
    <div>
      <h1 id="appName">Sistem Absensi</h1>
      <p id="lembaga">SMP · Tapel 2026/2027</p>
    </div>
  </div>

  <form class="card" onsubmit="doLogin(event)">
    <h2>Selamat Datang</h2>
    <p class="sub">Silakan masuk untuk melanjutkan</p>

    <div class="err" id="errBox"></div>

    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
        <input id="u" placeholder="Masukkan username" autocomplete="username" required autofocus>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
        <input id="p" type="password" placeholder="Masukkan password" autocomplete="current-password">
      </div>
    </div>

    <button type="submit" class="btn-masuk" id="btnLogin">
      <span>Masuk</span>
      <span>→</span>
    </button>

    <div class="hint">
      SILAHKAN LOGIN
    </div>
  </form>

  <div class="foot">
    © 2026 <b>Sistem Absensi</b> · All rights reserved
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

// Ambil config
fetch('/api/config').then(r => r.json()).then(c => {
  if (c.appName) $('#appName').textContent = c.appName;
  if (c.lembaga) $('#lembaga').textContent = `${c.lembaga} · Tapel ${c.tahunPelajaran}`;
  document.title = 'Login - ' + (c.appName || 'Absensi Siswa');
}).catch(()=>{});

async function doLogin(e){
  e.preventDefault();
  $('#errBox').style.display = 'none';
  $('#btnLogin').disabled = true;
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({ username: $('#u').value, password: $('#p').value }),
    });
    const d = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(d.error || 'Login gagal');
    window.location.replace('/dashboard');
  } catch (err) {
    $('#errBox').textContent = err.message;
    $('#errBox').style.display = 'block';
    $('#btnLogin').disabled = false;
  }
}
</script>
</body>
  </html>
